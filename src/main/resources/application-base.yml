# Configurações estáveis, que não variam entre ambientes: nome da aplicação, rotas,
# resiliência, actuator e logging. O que varia por ambiente (Redis, timeouts,
# OAuth2 e Eureka) fica nos arquivos *-env.

server:
  port: 9999

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

# cloud.gateway.server.webflux.routes são configs de roteamento do gateway com os outros serviços
# aceita uri externa e interna, posso redicionar até pro google
# como billing e ordering usa partes do endpoints igual customers, devemos priorizar quem tem ordem, logo billing vem primeiro
# pois ele é mais especifico, sem isso toda requisição feita em billing cai no ordering

# usamos lb:// para identificar como load balance e passamos o nome do serviço registrado no service registry em uri
# assim não precisamos passar o path completo http://serviço:0000
# DedupeResponseHeader remove duplicacoes de headers e RETAIN_FIRST prioriza configs de gateway ao inves do serviço
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          route-refresh-listener:
            enabled: false # desativa o refresh de rotas toda vez que chamar o eureka
          filter:
            local-response-cache:
              enabled: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry # global retry resilience
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms # primeira tentativa
                  maxBackoff: 20ms # ultima tentativa
          routes:
            - id: billing-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/customers/me/credit-cards/**
            # webhook publico chamado pelo Fastpay, sem token - liberado no security do gateway
            - id: billing-webhook-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/webhooks/fastpay
                - Method=POST
            - id: ordering-route
              uri: lb://ordering
              predicates: # redireciona para uri
                - Path=/api/v1/customers/**,/api/v1/shipping-cost-previews
              filters: # route circuit breaker resilience
                - name: CircuitBreaker
                  args:
                    name: ordering-route-cb
                    statusCodes:
                      - 502
                      - 504
                      - 500
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - LocalResponseCache=5m,30MB # local cache resilience (GET)
                - name: RequestRateLimiter # rate limit (token bucket no Redis), estoura = 429
                  args:
                    redis-rate-limiter:
                      replenishRate: 50 # tokens repostos por segundo (taxa sustentada)
                      burstCapacity: 200 # tamanho do bucket (pico maximo de uma vez)
                      requestedTokens: 1 # tokens gastos por requisição
                    key-resolver: "#{@rateLimitKeyResolver}" # bean que define a chave de contagem (ex: token usuário)
            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

eureka:
  client:
    registerWithEureka: false # não se registra como client
    fetchRegistry: true # busca os serviços dentro eureka

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,circuitbreakers
  endpoint:
    gateway:
      enabled: true

# circuit breaker configs customizado
resilience4j.circuitbreaker:
  instances:
    ordering-route-cb:
      slidingWindowSize: 8 # maximo de chamadas
      failureRateThreshold: 50 # abre o circuito
      minimumNumberOfCalls: 5 # minimo de chamadas para abrir
      permittedNumberOfCallsInHalfOpenState: 5 # chamadas permitidas em meio aberto, se sucesso fecha o circuit
      slidingWindowType: COUNT_BASED
      waitDurationInOpenState: 10s # tempo de circuito aberto
      maxWaitDurationInHalfOpenState: 30s # tempo meio aberto após o aberto
      registerHealthIndicator: true # indicador de saúde do circuto

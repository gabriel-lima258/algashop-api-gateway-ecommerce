server:
  port: 9999

# cloud.gateway.server.webflux.routes são configs de roteamento do gateway com os outros serviços
# aceita uri externa e interna, posso redicionar até pro google
# como billing e ordering usa partes do endpoints igual customers, devemos priorizar quem tem ordem, logo billing vem primeiro
# pois ele é mais especifico, sem isso toda requisição feita em billing cai no ordering

# RewritePath=/public/products(?<segment>/?.*), /api/v1/products$\{segment}
# redireciona qualquer rota /products para o path correto, temos diversos filters interresantes

# usamos lb:// para identificar como load balance e passamos o nome do serviço registrado no service registry em uri
# assim não precisamos passar o path completo http://serviço:0000
# DedupeResponseHeader remove duplicacoes de headers e RETAIN_FIRST prioriza configs de gateway ao inves do serviço
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.algashop.local:9000
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors: # cors global para todas as rotas
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: http://admin.algashop.local:4200
                allowedHeaders: '*'
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
          routes:
            - id: billing-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/customers/me/orders/{orderId}/invoice,/api/v1/orders/{orderId}/invoice,/api/v1/customers/me/credit-cards/**
            # webhook publico chamado pelo Fastpay, sem token - liberado no security do gateway
            - id: billing-webhook-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/webhooks/fastpay
                - Method=POST
            - id: ordering-route
              uri: lb://ordering
              predicates: # redireciona para uri
                - Path=/api/v1/orders/**,/api/v1/customers/**,/api/v1/shipping-cost-previews
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/upload-requests
                - Method=GET,POST,PUT,DELETE,OPTIONS
            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://algashop-service-registry:8761/eureka
    registerWithEureka: false # não se registra como client
    fetchRegistry: true # busca os serviços dentro eureka

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

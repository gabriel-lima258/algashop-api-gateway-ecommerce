# Em produção as propriedades vêm de variáveis de ambiente do sistema operacional,
# sem re-importar do AWS SSM (sem defaults: ausência de variável derruba o boot cedo).

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT}
            response-timeout: ${HTTP_CLIENT_RESPONSE_TIMEOUT}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL}

eureka:
  client:
    serviceUrl:
      defaultZone: ${SERVICE_REGISTRY_URL}/eureka
